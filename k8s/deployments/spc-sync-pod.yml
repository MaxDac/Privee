# Mounting the SPC triggers the driver to fetch from Key Vault and create/refresh the ingress-tls secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kv-sync
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kv-sync
  template:
    metadata:
      labels: { app: kv-sync }
      annotations:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: kv-reader-sa
      containers:
      - name: sleep
        image: mcr.microsoft.com/cbl-mariner/busybox:2.0
        command: ["/bin/sh","-c","sleep 3650d"]
        volumeMounts:
        - name: secrets-store-inline
          mountPath: /mnt/secrets-store
          readOnly: true
      volumes:
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: kv-tls