apiVersion: apps/v1
kind: Deployment
metadata:
  name: privee
spec:
  selector:
    matchLabels:
      app: privee
      app.kubernetes.io/name: privee-app
      app.kubernetes.io/instance: privee-node
  replicas: 3
  template:
    metadata:
      labels:
        app: privee
        app.kubernetes.io/name: privee-app
        app.kubernetes.io/instance: privee-node
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: privee
        image: privee.azurecr.io/privee
        # Start the Phoenix server
        command: ["./bin/server"]
        # command: [ "sh", "-c"]
        # args: ["while true; do echo 'yo' && sleep 5; done;"]
        resources:
          limits:
            memory: "520Mi"
            cpu: "500m"
        ports:
        - name: epmd
          containerPort: 4369
          protocol: TCP
        - name: app-port
          containerPort: 4000
          protocol: TCP
        env:
        # Release configuration
        - name: RELEASE_NAME
          value: privee
        - name: RELEASE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: RELEASE_NODE
          value: $(RELEASE_NAME)@$(RELEASE_IP)
        # Phoenix configuration
        - name: PHX_HOST
          value: "privee.westeurope.cloudapp.azure.com"  # Update with your Azure DNS name
        - name: PHX_PORT
          value: "80"
        - name: PORT
          value: "4000"
        # Database configuration
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
        - name: POSTGRES_HOST
          value: ed6c59338ca8.privee-db.private.postgres.database.azure.com
        - name: DATABASE_URL
          value: ecto://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST)/$(POSTGRES_DB)
        # Security
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              name: privee-app-secret
              key: SECRET_KEY_BASE
        # Clustering configuration
        - name: DNS_CLUSTER_QUERY
          value: "privee-app-svc-headless.default.svc.cluster.local"
        # Environment marker for Kubernetes
        - name: DEPLOYMENT_PLATFORM
          value: "azure-aks"
        # Resource limits for OTP
        - name: ERL_MAX_PORTS
          value: "8192"
        - name: ERL_CRASH_DUMP
          value: "/tmp/erl_crash.dump"
        # Health check configuration
        livenessProbe:
          httpGet:
            path: /
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 5
