apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: privee-grafana-egress
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: privee
  policyTypes:
  - Egress
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow HTTPS to Grafana Cloud (EU West 2)
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Allow HTTP/HTTPS to external services
  - to: []
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
  # Allow communication within cluster
  - to:
    - namespaceSelector: {}
  # Allow OTLP gRPC to Grafana
  - to: []
    ports:
    - protocol: TCP
      port: 4317
    - protocol: TCP
      port: 4318
