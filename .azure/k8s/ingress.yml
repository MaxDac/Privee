# ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: privee-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # cert-manager will automatically create and manage the TLS certificate
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  tls:
    - hosts: [ "${INGRESS_HOST}" ]
      secretName: privee-tls-secret
  rules:
    - host: ${INGRESS_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: privee
                port:
                  number: 80
