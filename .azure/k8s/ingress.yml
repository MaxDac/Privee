# ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: privee-ingress
  annotations:
    kubernetes.azure.com/tls-cert-keyvault-uri: "${CERT_URI}"
    # The add-on will fetch cert from Key Vault via CSI driver. See docs for details.
    # [1](https://learn.microsoft.com/en-us/azure/aks/app-routing-dns-ssl)
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  # TLS section is optional; when using a Public IP DNS label (e.g., <label>.northeurope.cloudapp.azure.com),
  # you typically won't have a certificate. The deploy script can remove/skip TLS when not configured.
  tls:
    - hosts: [ "${INGRESS_HOST}" ]
      secretName: keyvault-privee-ingress
  rules:
    - host: ${INGRESS_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: privee
                port:
                  number: 80
