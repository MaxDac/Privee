# ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: privee-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # cert-manager will automatically create and manage the TLS certificate
    # WebSocket support for Phoenix LiveView - Azure Web App Routing supports NGINX annotations
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "privee"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  tls:
    - hosts: [ "${INGRESS_HOST}" ]
      secretName: privee-tls-secret
  rules:
    - host: ${INGRESS_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: privee
                port:
                  number: 80
