# Kubernetes Secrets for Privee Application
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: default
type: Opaque
data:
  # Base64 encoded values - replace these with your actual base64 encoded credentials
  # To generate: echo -n "your_value" | base64
  POSTGRES_USER: cHJpdmVlZGJhZG1pbg==  # postgres (base64 encoded)
  POSTGRES_PASSWORD: fn5LRUVONGV+fg==  # password (base64 encoded) - CHANGE THIS!
  POSTGRES_DB: cHJpdmVl  # privee (base64 encoded)
---
apiVersion: v1
kind: Secret
metadata:
  name: privee-app-secret
  namespace: default
type: Opaque
data:
