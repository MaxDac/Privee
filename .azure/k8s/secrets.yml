  # Generate with: mix phx.gen.secret | base64
  # This is a placeholder - GENERATE A NEW ONE!
  SECRET_KEY_BASE: UUV4SmMyTnZaVzU1YzJSa2EzSXplREZqVFRrNWQwMU9kRFpXWVhSc2NYUDNNV1ZQYW5sVmNVTk9NR2xuZURReA==
