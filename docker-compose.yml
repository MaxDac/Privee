# Self-hosted Privee: the app, PostgreSQL and Caddy (automatic HTTPS).
# Copy .env.example to .env, fill it in, then run `docker compose up -d`.
# See docs/self-hosting.md.

services:
  privee:
    build: .
    image: privee:latest
    restart: unless-stopped
    # Chats are stored in memory on a single node: never scale this service.
    command: ["/bin/sh", "-c", "/app/bin/migrate && exec /app/bin/server"]
    environment:
      PHX_HOST: ${PHX_HOST:?Set PHX_HOST in .env}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in .env}
      DATABASE_URL: ecto://privee:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db/privee
      PORT: "4000"
      PHX_PORT: ${PHX_PORT:-443}
      POOL_SIZE: ${POOL_SIZE:-10}
      PRIVEE_INSTANCE_NAME: ${PRIVEE_INSTANCE_NAME:-}
      PRIVEE_SOURCE_URL: ${PRIVEE_SOURCE_URL:-https://github.com/MaxDac/Privee}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: privee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: privee
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privee -d privee"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PHX_HOST: ${PHX_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - privee

volumes:
  db-data:
  caddy-data:
  caddy-config:
