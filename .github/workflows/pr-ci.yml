name: Privee PR CI

# Temporarily blocked - original triggers commented out
on:
  workflow_dispatch: # Manual trigger only

# Original triggers (temporarily disabled):
# on:
#   pull_request:
#     types:
#       - synchronize
#       - reopened
#     branches:
#       - main

permissions:
  contents: read

jobs:
  build:
    # The `runs-on` configuration must be set only at the top level workflow execution.
    runs-on: ubuntu-24.04

    name: Pull Request CI Build and test app with Erlang ${{ matrix.otp }} / Elixir ${{ matrix.elixir }}

    env:
      MIX_ENV: test

    services:
      db:
        image: "postgres:11"
        ports: ["5432:5432"]
        env:
          POSTGRES_PASSWORD: "postgres"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      # Specify the OTP and Elixir versions to use when building
      # and running the workflow steps.
      matrix:
        otp: ["28.0.1"]
        elixir: ["1.18.4"]
        node: ["22"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Loading tooling
        uses: ./.github/actions/load-tooling
        with:
          otp: ${{ matrix.otp }}
          elixir: ${{ matrix.elixir }}
          node: ${{ matrix.node }}

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Breakpoint if tests failed
        if: failure()
        uses: namespacelabs/breakpoint-action@v0
        with:
          duration: 30m
          authorized-users: MaxDac

      - name: Build PR
        uses: ./.github/actions/compile-pr

      - name: Check PR
        uses: ./.github/actions/check-pr
        with:
          otp: ${{ matrix.otp }}
          elixir: ${{ matrix.elixir }}

      - name: Test PR
        uses: ./.github/actions/test-pr

  check-client:
    # The `runs-on` configuration must be set only at the top level workflow execution.
    runs-on: ubuntu-24.04

    name: Pull Request CI Build and test client with Node ${{ matrix.node }}

    env:
      MIX_ENV: test

    strategy:
      # Specify the OTP and Elixir versions to use when building
      # and running the workflow steps.
      matrix:
        otp: ["28.0.1"]
        elixir: ["1.18.4"]
        zig: ["0.14.1"]
        node: ["22"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Loading tooling
        uses: ./.github/actions/load-tooling
        with:
          otp: ${{ matrix.otp }}
          elixir: ${{ matrix.elixir }}
          zig: ${{ matrix.zig }}
          node: ${{ matrix.node }}

      - name: Test Client
        uses: ./.github/actions/check-client
        with:
          node: ${{ matrix.node }}

  check-image-build:
    # The `runs-on` configuration must be set only at the top level workflow execution.
    runs-on: ubuntu-24.04

    name: Pull Request CI check image build against Fly

    concurrency: deploy-group # optional: ensure only one action runs at a time

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fly.io deployment
        uses: ./.github/actions/fly-deploy
        with:
          fly_api_token: ${{ secrets.FLY_API_TOKEN }}
          build_only: "true"