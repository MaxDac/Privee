name: Provision Azure Infrastructure

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: azure-infra-provision
  cancel-in-progress: false

jobs:
  provision:
    name: Deploy Azure infra (KV -> Cluster)
    runs-on: ubuntu-24.04
    env:
      RESOURCE_GROUP: privee-dev-rg
      AZURE_CONTAINER_REGISTRY: priveeregistry
      REGISTRY_URL: priveeregistry.azurecr.io
      PROJECT_NAME: privee
      CLUSTER_NAME: privee-aks
      CONTAINER_NAME: privee
      DEPLOYMENT_MANIFEST_PATH: |
        ./.azure/k8s/deployment.yml
      # Set the Azure-specific host for Phoenix compilation
      PHX_HOST: privee.northeurope.cloudapp.azure.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CONTRIBUTOR_CLIENT_ID }}
          tenant-id: ${{ secrets.CONTRIBUTOR_TENANT_ID }}
          subscription-id: ${{ secrets.CONTRIBUTOR_SUBSCRIPTION_ID }}

      - name: Ensure Bicep CLI is available
        run: |
          az bicep install
          az bicep version

      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi
          jq --version

      - name: Deploy/Recover Key Vault (standalone)
        run: |
          bash ./.azure/deploy-keyvault.sh --auto-recover

      - name: Deploy main infrastructure (subscription + RG-level)
        run: |
          bash ./.azure/deploy.sh
        
      # Re-logging in because the deployment may last too long and the token may expire
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CONTRIBUTOR_CLIENT_ID }}
          tenant-id: ${{ secrets.CONTRIBUTOR_TENANT_ID }}
          subscription-id: ${{ secrets.CONTRIBUTOR_SUBSCRIPTION_ID }}

      - name: Set secrets to Key Vault
        run: |
          bash ./.azure/scripts/set-secrets-to-dev-kv.sh

      - name: Push Azure credentials to GitHub secrets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash ./.azure/scripts/push-info-to-gh-secrets.sh --ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR using OIDC session
        run: |
          az acr login --name "${AZURE_CONTAINER_REGISTRY}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_URL }}/${{ env.PROJECT_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY_URL }}/${{ env.PROJECT_NAME }}:latest
          build-args: |
            BUILD_DATE=${{ github.run_id }}
            VCS_REF=${{ github.sha }}
            PHX_HOST=${{ env.PHX_HOST }}

      - name: Azure login (OIDC) - Refresh for K8s operations
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CONTRIBUTOR_CLIENT_ID }}
          tenant-id: ${{ secrets.CONTRIBUTOR_TENANT_ID }}
          subscription-id: ${{ secrets.CONTRIBUTOR_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials --resource-group "${RESOURCE_GROUP}" --name "${CLUSTER_NAME}" --overwrite-existing

      - name: Deploy Kubernetes deployments
        run: |
          bash ./.azure/k8s/deploy.sh
