name: Provision Azure Infrastructure

on:
  workflow_dispatch: {}
  # Optionally trigger after main CI succeeds. Uncomment if desired.
  # workflow_run:
  #   workflows: ["Privee Main CI/CD pipeline"]
  #   types: [completed]
  #   branches: [main]

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: azure-infra-provision
  cancel-in-progress: false

jobs:
  provision:
    name: Deploy Azure infra (KV -> Cluster)
    runs-on: ubuntu-24.04
    # If using workflow_run above, restrict to successful runs only
    # if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Bicep CLI is available
        run: |
          az bicep install
          az bicep version

      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi
          jq --version

      - name: Deploy/Recover Key Vault (standalone)
        run: |
          bash ./.azure/deploy-keyvault.sh --auto-recover

      - name: Deploy main infrastructure (subscription + RG-level)
        run: |
          bash ./.azure/deploy.sh
