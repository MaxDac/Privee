name: Test Azure deployment

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

    branches:
      - main

permissions:
  id-token: write
  contents: read
  actions: read

env:
  MIX_ENV: test

jobs:
  azure-deploy:
    name: Deploy application on Azure AKS cluster
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Image build and Azure AKS cluster deployment
        uses: ./.github/actions/azure-deploy
        with:
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          acr-username: ${{ secrets.ACR_USER }}
          acr-password: ${{ secrets.ACR_SECRET }}
