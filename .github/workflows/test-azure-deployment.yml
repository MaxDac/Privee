name: Run Azure test deployment

on:
  # Enable manual triggers for testing
  workflow_dispatch:
  
  # Run on pull requests for branch validation
  pull_request:
    branches: [main]

env:
  # Environment-specific configuration
  RESOURCE_GROUP: ${{ github.event_name == 'pull_request' && 'privee-dev-rg' || 'privee-dev-rg' }}
  AZURE_CONTAINER_REGISTRY: priveeregistry
  REGISTRY_URL: priveeregistry.azurecr.io
  PROJECT_NAME: privee
  CLUSTER_NAME: ${{ github.event_name == 'pull_request' && 'privee-aks' || 'privee-aks' }}
  CONTAINER_NAME: privee
  DEPLOYMENT_MANIFEST_PATH: |
    ./.azure/k8s/deployment.yml
  # Set the Azure-specific host for Phoenix compilation
  PHX_HOST: privee.northeurope.cloudapp.azure.com
  # Add PR context for tagging
  IS_PR: ${{ github.event_name == 'pull_request' }}

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  # Build job - runs on all triggers (PR validation + deployment prep)
  build:
    runs-on: ubuntu-24.04
    outputs:
      image-tag: ${{ steps.build-vars.outputs.image-tag }}
      image-uri: ${{ steps.acr-build.outputs.image-uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set build variables
        id: build-vars
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # For PRs, use pr-<number>-<short-sha>
            IMAGE_TAG="pr-${{ github.event.number }}-$(echo ${{ github.sha }} | cut -c1-8)"
          else
            # For main/develop, use branch-<short-sha>
            IMAGE_TAG="${{ github.ref_name }}-$(echo ${{ github.sha }} | cut -c1-8)"
          fi
          echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "🏷️ Image tag will be: ${IMAGE_TAG}"
        
      - name: Build and push image using Azure Container Registry
        id: acr-build
        uses: ./.github/actions/acr-build
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          registry: ${{ env.AZURE_CONTAINER_REGISTRY }}
          image-name: ${{ env.PROJECT_NAME }}
          image-tag: ${{ steps.build-vars.outputs.image-tag }}
          additional-tags: ${{ github.event_name != 'pull_request' && 'latest' || '' }}
          dockerfile: "Dockerfile"
          build-context: "."
          resource-group: ${{ env.RESOURCE_GROUP }}
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}
            PHX_HOST=${{ env.PHX_HOST }}
            ENABLE_DB_SSL=true

  # Deploy job - only runs on main/develop branch pushes or manual dispatch
  deploy:
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'pull_request'
    environment: 
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubelogin for non-interactive login
        uses: azure/use-kubelogin@v1.2
        with:
          kubelogin-version: 'v0.0.24'

      - name: Gets K8s context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Deploys application
        uses: Azure/k8s-deploy@v5
        with:
          namespace: default
          action: deploy
          images: |
            ${{ env.REGISTRY_URL }}/${{ env.PROJECT_NAME }}:${{ needs.build.outputs.image-tag }}
          manifests: |
            ${{ env.DEPLOYMENT_MANIFEST_PATH }}