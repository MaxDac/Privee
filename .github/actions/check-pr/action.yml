name: check-pr
description: "Run all PR checks: formatting, Credo, and Dialyzer"

inputs:
  otp:
    description: "OTP version"
    required: true
    default: "28.0.1"
  elixir:
    description: "Elixir version"
    required: true
    default: "1.18.4"

runs:
  using: "composite"

  steps:
    # Step 1: Check formatting
    - name: Check Formatting
      uses: ./.github/actions/format-pr
      with:
        otp: ${{ inputs.otp }}
        elixir: ${{ inputs.elixir }}

    # Step 2: Check Credo rules
    - name: Check Credo
      uses: ./.github/actions/credo-pr
      with:
        otp: ${{ inputs.otp }}
        elixir: ${{ inputs.elixir }}

    # Step 3: Run Dialyzer
    - name: Run Dialyzer
      uses: ./.github/actions/dialyxir-pr
      with:
        otp: ${{ inputs.otp }}
        elixir: ${{ inputs.elixir }}