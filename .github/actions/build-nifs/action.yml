name: build-nifs
description: "Build Zig NIFs in the project"

inputs:
  zig:
    description: "Zig compiler version"
    required: true
    default: "0.13.0"

runs:
  using: "composite"

  steps:
    - name: Building NIFs
      shell: bash
      working-directory: nifs
      run: zig build -- /opt/hostedtoolcache/otp/ubuntu-24.04/OTP-27.2.4/x64/erts-15.2.2/include
