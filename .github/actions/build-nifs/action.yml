name: build-nifs
description: "Build Zig NIFs in the project"

inputs:
  zig:
    type: string
    description: "Zig compiler version"
    required: true
    default: "0.11.0"

permissions:
  contents: read

runs:
  using: "composite"

  steps:
    - name: Building NIFs
      shell: bash
      run: zig build --build-file nifs/build.zig -- /opt/hostedtoolcache/otp/ubuntu-24.04/OTP-27.1.2/x64/erts-15.1.2/include
