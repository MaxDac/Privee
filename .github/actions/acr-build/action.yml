name: Azure Container Registry - Build and Push
description: "Build and push container images to Azure Container Registry using OIDC authentication"

inputs:
  registry:
    description: "Azure Container Registry name (without .azurecr.io suffix)"
    required: true
  image-name:
    description: "Docker image name"
    required: true
  image-tag:
    description: "Docker image tag"
    required: true
  additional-tags:
    description: "Additional image tags (space-separated)"
    required: false
    default: "latest"
  dockerfile:
    description: "Path to the Dockerfile"
    required: false
    default: "Dockerfile"
  build-context:
    description: "Build context path"
    required: false
    default: "."
  build-args:
    description: "Build arguments as key=value pairs (one per line)"
    required: false
    default: ""

outputs:
  image-digest:
    description: "The digest of the built image"
    value: ${{ steps.build.outputs.digest }}
  image-uri:
    description: "The full URI of the built image"
    value: ${{ steps.build.outputs.uri }}

runs:
  using: "composite"
  steps:
    - name: Build and push to ACR
      id: build
      shell: bash
      run: |
        echo "🏗️ Building and pushing image to Azure Container Registry..."
        
        # Prepare build command
        BUILD_CMD="az acr build"
        BUILD_CMD="${BUILD_CMD} --registry ${{ inputs.registry }}"
        BUILD_CMD="${BUILD_CMD} --file ${{ inputs.dockerfile }}"
        
        # Add primary image tag
        BUILD_CMD="${BUILD_CMD} --image ${{ inputs.image-name }}:${{ inputs.image-tag }}"
        
        # Add additional tags if provided
        if [[ -n "${{ inputs.additional-tags }}" ]]; then
          IFS=' ' read -ra TAGS <<< "${{ inputs.additional-tags }}"
          for tag in "${TAGS[@]}"; do
            BUILD_CMD="${BUILD_CMD} --image ${{ inputs.image-name }}:${tag}"
          done
        fi
        
        # Add build arguments if provided
        if [[ -n "${{ inputs.build-args }}" ]]; then
          while IFS= read -r line; do
            if [[ -n "$line" ]]; then
              BUILD_CMD="${BUILD_CMD} --build-arg ${line}"
            fi
          done <<< "${{ inputs.build-args }}"
        fi
        
        # Add build context
        BUILD_CMD="${BUILD_CMD} ${{ inputs.build-context }}"
        
        echo "Executing: ${BUILD_CMD}"
        
        # Execute the build command and capture output
        OUTPUT=$(${BUILD_CMD} 2>&1)
        EXIT_CODE=$?
        
        echo "${OUTPUT}"
        
        if [ ${EXIT_CODE} -ne 0 ]; then
          echo "❌ ACR build failed with exit code ${EXIT_CODE}"
          exit ${EXIT_CODE}
        fi
        
        # Extract digest and URI from output (if available)
        DIGEST=$(echo "${OUTPUT}" | grep -oP 'digest: sha256:\K[a-f0-9]+' | head -1 || echo "")
        if [[ -n "${DIGEST}" ]]; then
          echo "digest=sha256:${DIGEST}" >> $GITHUB_OUTPUT
          echo "uri=${{ inputs.registry }}.azurecr.io/${{ inputs.image-name }}@sha256:${DIGEST}" >> $GITHUB_OUTPUT
        else
          echo "uri=${{ inputs.registry }}.azurecr.io/${{ inputs.image-name }}:${{ inputs.image-tag }}" >> $GITHUB_OUTPUT
        fi
        
        echo "✅ Successfully built and pushed image to ACR"
