name: Azure Container Registry - Build and Push
description: "Build and push container images to Azure Container Registry using OIDC authentication"

inputs:
  # Azure Authentication
  azure-client-id:
    description: "Azure Client ID for OIDC authentication"
    required: true
  azure-tenant-id:
    description: "Azure Tenant ID for OIDC authentication"
    required: true
  azure-subscription-id:
    description: "Azure Subscription ID for OIDC authentication"
    required: true
  
  # ACR Build Configuration
  registry:
    description: "Azure Container Registry name (without .azurecr.io suffix)"
    required: true
  image-name:
    description: "Docker image name"
    required: true
  image-tag:
    description: "Docker image tag"
    required: true
  additional-tags:
    description: "Additional image tags (space-separated)"
    required: false
    default: "latest"
  dockerfile:
    description: "Path to the Dockerfile"
    required: false
    default: "Dockerfile"
  build-context:
    description: "Build context path"
    required: false
    default: "."
  build-args:
    description: "Build arguments as key=value pairs (one per line)"
    required: false
    default: ""
  resource-group:
    description: "Azure Resource Group name (for diagnostics)"
    required: false
    default: ""

outputs:
  image-digest:
    description: "The digest of the built image"
    value: ${{ steps.build.outputs.digest }}
  image-uri:
    description: "The full URI of the built image"
    value: ${{ steps.build.outputs.uri }}

runs:
  using: "composite"
  steps:
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        subscription-id: ${{ inputs.azure-subscription-id }}
    
    - name: Verify Azure CLI and ACR access
      uses: azure/CLI@v2.1.0
      with:
        azcliversion: latest
        inlineScript: |
          echo "🔍 Verifying Azure CLI and ACR access..."
          
          # Check Azure CLI version
          echo "Azure CLI version:"
          az --version | head -1
          
          # Check current Azure account with full details
          echo "Current Azure account:"
          az account show --query "{subscriptionId: id, tenantId: tenantId, name: name, state: state}" -o table
          
          echo "Service Principal details:"
          az account show --query "{servicePrincipalId: user.name, type: user.type}" -o table
          
          # Check service principal permissions
          echo "🔐 Checking service principal permissions..."
          
          # Test basic subscription access
          echo "Testing subscription read access:"
          if az account show > /dev/null 2>&1; then
            echo "✅ Can read subscription information"
          else
            echo "❌ Cannot read subscription information"
          fi
          
          # Test resource group listing with detailed error handling
          echo "Testing resource group listing:"
          RG_OUTPUT=$(az group list --query "[].{Name:name, Location:location}" -o table 2>&1) || true
          if [[ "$RG_OUTPUT" == *"ERROR"* ]] || [[ "$RG_OUTPUT" == *"Forbidden"* ]]; then
            echo "❌ Failed to list resource groups - Permission denied"
            echo "Error details: $RG_OUTPUT"
          elif [[ -z "$RG_OUTPUT" ]] || [[ "$RG_OUTPUT" == "[]" ]]; then
            echo "⚠️  No resource groups found (empty result)"
          else
            echo "✅ Successfully listed resource groups:"
            echo "$RG_OUTPUT"
          fi
          
          # Test specific resource group access
          echo "Testing specific resource group access (if provided via env):"
          if [[ -n "${{ inputs.resource-group }}" ]]; then
            echo "Checking access to resource group: ${{ inputs.resource-group }}"
            RG_SHOW=$(az group show --name "${{ inputs.resource-group }}" --query "{Name:name, Location:location, State:properties.provisioningState}" -o table 2>&1) || true
            if [[ "$RG_SHOW" == *"ERROR"* ]] || [[ "$RG_SHOW" == *"NotFound"* ]] || [[ "$RG_SHOW" == *"Forbidden"* ]]; then
              echo "❌ Cannot access resource group '${{ inputs.resource-group }}'"
              echo "Error: $RG_SHOW"
            else
              echo "✅ Successfully accessed resource group:"
              echo "$RG_SHOW"
            fi
          fi
          
          # Test ACR specific permissions
          echo "Testing ACR service permissions:"
          ACR_LIST_OUTPUT=$(az acr list --query "[].{Name:name, ResourceGroup:resourceGroup, Location:location}" -o table 2>&1) || true
          if [[ "$ACR_LIST_OUTPUT" == *"ERROR"* ]] || [[ "$ACR_LIST_OUTPUT" == *"Forbidden"* ]]; then
            echo "❌ Failed to list ACR registries - Permission denied"
            echo "Error details: $ACR_LIST_OUTPUT"
          elif [[ -z "$ACR_LIST_OUTPUT" ]] || [[ "$ACR_LIST_OUTPUT" == "[]" ]]; then
            echo "⚠️  No ACR registries found (may be permission or existence issue)"
          else
            echo "✅ Successfully listed ACR registries:"
            echo "$ACR_LIST_OUTPUT"
          fi
          
          # Test direct access to the specific registry
          echo "Testing direct access to registry: ${{ inputs.registry }}"
          ACR_SHOW_OUTPUT=$(az acr show --name "${{ inputs.registry }}" --query "{name:name, resourceGroup:resourceGroup, location:location}" -o table 2>&1) || true
          if [[ "$ACR_SHOW_OUTPUT" == *"ERROR"* ]] || [[ "$ACR_SHOW_OUTPUT" == *"NotFound"* ]]; then
            echo "❌ Cannot access ACR registry '${{ inputs.registry }}'"
            echo "Error details: $ACR_SHOW_OUTPUT"
            
            # Additional diagnostic: check if registry exists by trying different approaches
            echo "🔍 Additional diagnostics:"
            echo "Trying alternative ACR access methods..."
            
            # Try with resource group if available
            if [[ -n "${{ inputs.resource-group }}" ]]; then
              echo "Trying to list ACRs in resource group: ${{ inputs.resource-group }}"
              RG_ACR_OUTPUT=$(az acr list --resource-group "${{ inputs.resource-group }}" --query "[].name" -o table 2>&1) || true
              if [[ "$RG_ACR_OUTPUT" != *"ERROR"* ]]; then
                echo "ACRs in resource group ${{ inputs.resource-group }}: $RG_ACR_OUTPUT"
              else
                echo "Failed to list ACRs in resource group: $RG_ACR_OUTPUT"
              fi
            fi
            
            # Check role assignments
            echo "Checking current user's role assignments:"
            ROLE_OUTPUT=$(az role assignment list --assignee "$(az account show --query user.name -o tsv)" --query "[].{Role:roleDefinitionName, Scope:scope}" -o table 2>&1) || true
            if [[ "$ROLE_OUTPUT" != *"ERROR"* ]]; then
              echo "Current role assignments:"
              echo "$ROLE_OUTPUT"
            else
              echo "Failed to retrieve role assignments: $ROLE_OUTPUT"
            fi
            
            exit 1
          else
            echo "✅ Successfully accessed ACR registry '${{ inputs.registry }}':"
            echo "$ACR_SHOW_OUTPUT"
          fi
    
    - name: Build and push to ACR
      id: build
      uses: azure/CLI@v2.1.0
      with:
        azcliversion: latest
        inlineScript: |
          echo "🏗️ Building and pushing image to Azure Container Registry..."
          
          # Build the command step by step for better debugging
          echo "Registry: ${{ inputs.registry }}"
          echo "Image Name: ${{ inputs.image-name }}"
          echo "Image Tag: ${{ inputs.image-tag }}"
          echo "Dockerfile: ${{ inputs.dockerfile }}"
          echo "Build Context: ${{ inputs.build-context }}"
          echo "Additional Tags: ${{ inputs.additional-tags }}"
          echo "Build Args: ${{ inputs.build-args }}"
          
          # Start with base command
          CMD_ARGS=(
            "acr" "build"
            "--registry" "${{ inputs.registry }}"
            "--file" "${{ inputs.dockerfile }}"
          )
          
          # Add primary image tag
          CMD_ARGS+=("--image" "${{ inputs.image-name }}:${{ inputs.image-tag }}")
          
          # Add additional tags if provided
          if [[ -n "${{ inputs.additional-tags }}" ]]; then
            IFS=' ' read -ra TAGS <<< "${{ inputs.additional-tags }}"
            for tag in "${TAGS[@]}"; do
              if [[ -n "${tag}" ]]; then
                CMD_ARGS+=("--image" "${{ inputs.image-name }}:${tag}")
              fi
            done
          fi
          
          # Add build arguments if provided
          if [[ -n "${{ inputs.build-args }}" ]]; then
            while IFS= read -r line; do
              if [[ -n "$line" ]]; then
                CMD_ARGS+=("--build-arg" "${line}")
              fi
            done <<< "${{ inputs.build-args }}"
          fi
          
          # Add build context
          CMD_ARGS+=("${{ inputs.build-context }}")
          
          # Print the full command for debugging
          echo "Executing: az ${CMD_ARGS[*]}"
          
          # Execute the build command with timeout and better error handling
          set -e  # Exit on error
          echo "Starting ACR build (timeout: 20 minutes)..."
          
          # Use timeout to prevent hanging builds
          timeout 1200s az "${CMD_ARGS[@]}" 2>&1 | tee acr_build_output.log || {
            EXIT_CODE=$?
            echo "❌ ACR build failed with exit code ${EXIT_CODE}"
            
            if [[ ${EXIT_CODE} -eq 124 ]]; then
              echo "Build timed out after 20 minutes"
              echo "This might indicate:"
              echo "  - Build is taking too long (check Dockerfile efficiency)"
              echo "  - Network connectivity issues"
              echo "  - ACR service issues"
              
              # Try to check if the build is still running
              echo "Checking for recent ACR tasks..."
              az acr task list-runs --registry "${{ inputs.registry }}" --top 5 --query "[].{RunId:runId, Status:status, StartTime:startTime, FinishTime:finishTime}" -o table 2>/dev/null || echo "Could not retrieve ACR task status"
            elif [[ ${EXIT_CODE} -eq 1 ]]; then
              echo "Build failed - checking if it's a log retrieval issue..."
              
              # Check if build was queued but logs failed
              BUILD_OUTPUT=$(cat acr_build_output.log 2>/dev/null || echo "")
              if [[ "$BUILD_OUTPUT" == *"Queued a build with ID:"* ]] && [[ "$BUILD_OUTPUT" == *"Could not get logs for ID:"* ]]; then
                BUILD_ID=$(echo "$BUILD_OUTPUT" | grep -oP 'Queued a build with ID: \K\w+' | head -1)
                echo "Build was queued with ID: $BUILD_ID but logs could not be retrieved"
                echo "This is likely a transient ACR service issue"
                
                # Try to get the build status directly
                echo "Attempting to check build status directly..."
                sleep 10  # Give the build a moment to start
                
                for i in {1..12}; do  # Check for 2 minutes
                  BUILD_STATUS=$(az acr task list-runs --registry "${{ inputs.registry }}" --run-id "$BUILD_ID" --query "[0].status" -o tsv 2>/dev/null || echo "Unknown")
                  echo "Build $BUILD_ID status: $BUILD_STATUS (check $i/12)"
                  
                  if [[ "$BUILD_STATUS" == "Succeeded" ]]; then
                    echo "✅ Build completed successfully despite log retrieval issue"
                    
                    # Try to get the final image info
                    IMAGES=$(az acr task list-runs --registry "${{ inputs.registry }}" --run-id "$BUILD_ID" --query "[0].outputImages" -o tsv 2>/dev/null || echo "")
                    if [[ -n "$IMAGES" ]]; then
                      echo "Built images: $IMAGES"
                      # Set output for the first image
                      FIRST_IMAGE=$(echo "$IMAGES" | head -1)
                      if [[ "$FIRST_IMAGE" == *"@sha256:"* ]]; then
                        echo "uri=$FIRST_IMAGE" >> $GITHUB_OUTPUT
                        DIGEST=$(echo "$FIRST_IMAGE" | grep -oP '@sha256:\K[a-f0-9]+')
                        echo "digest=sha256:$DIGEST" >> $GITHUB_OUTPUT
                      else
                        echo "uri=${{ inputs.registry }}.azurecr.io/${{ inputs.image-name }}:${{ inputs.image-tag }}" >> $GITHUB_OUTPUT
                      fi
                    fi
                    exit 0
                  elif [[ "$BUILD_STATUS" == "Failed" ]]; then
                    echo "❌ Build failed - getting error details..."
                    az acr task logs --registry "${{ inputs.registry }}" --run-id "$BUILD_ID" 2>/dev/null || echo "Could not retrieve build logs"
                    exit 1
                  elif [[ "$BUILD_STATUS" == "Canceled" ]]; then
                    echo "❌ Build was canceled"
                    exit 1
                  elif [[ "$BUILD_STATUS" == "Error" ]]; then
                    echo "❌ Build encountered an error"
                    exit 1
                  elif [[ "$BUILD_STATUS" != "Running" ]] && [[ "$BUILD_STATUS" != "Queued" ]]; then
                    echo "❌ Unexpected build status: $BUILD_STATUS"
                    exit 1
                  fi
                  
                  sleep 10
                done
                
                echo "❌ Build status check timed out. Final status: $BUILD_STATUS"
                exit 1
              fi
            fi
            
            echo "Error output:"
            cat acr_build_output.log 2>/dev/null || echo "Could not read build output"
            exit ${EXIT_CODE}
          }
          
          OUTPUT=$(cat acr_build_output.log)
          
          echo "${OUTPUT}"
          
          # Extract digest and URI from output (if available)
          DIGEST=$(echo "${OUTPUT}" | grep -oP 'digest: sha256:\K[a-f0-9]+' | head -1 || echo "")
          if [[ -n "${DIGEST}" ]]; then
            echo "digest=sha256:${DIGEST}" >> $GITHUB_OUTPUT
            echo "uri=${{ inputs.registry }}.azurecr.io/${{ inputs.image-name }}@sha256:${DIGEST}" >> $GITHUB_OUTPUT
          else
            echo "uri=${{ inputs.registry }}.azurecr.io/${{ inputs.image-name }}:${{ inputs.image-tag }}" >> $GITHUB_OUTPUT
          fi
          
          echo "✅ Successfully built and pushed image to ACR"
